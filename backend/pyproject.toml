[project]
name = "fixpoint-backend"
version = "0.2.0"
description = "Fixpoint - multi-app AI agent with a deterministic safety envelope, approval gate and independent verifier."
requires-python = ">=3.11"
readme = "../README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
