name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (tests + lint + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixpoint
          POSTGRES_PASSWORD: fixpoint
          POSTGRES_DB: fixpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixpoint -d fixpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fixpoint:fixpoint@localhost:5432/fixpoint
      FIXPOINT_SIGNING_KEY: ci-signing-key
      FIXPOINT_WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build
